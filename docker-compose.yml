name: storefront-django-pgsql

services:
  # Core services (no profile - always available)
  postgres-db:
    image: postgres:18
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - '5432:5432'
    restart: always
    volumes:
      - postgres-db-data:/var/lib/postgresql/data

  django-web:
    build: .
    container_name: django-web
    depends_on:
      postgres-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    entrypoint: ["/bin/bash", "/app/wait-for-it.sh", "postgres-db:5432", "--", "/app/docker-entrypoint.sh"]
    env_file:
     - .env
    environment:
      DEBUG: ${DEBUG}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_LOGLEVEL: ${DJANGO_LOGLEVEL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_ENGINE: ${DATABASE_ENGINE}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      POPULATE_DB: ${POPULATE_DB}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: 5432
      DJANGO_SETTINGS_MODULE: storefront.settings.dev
      PYTHONUNBUFFERED: 1
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/store/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8000:8000"
    restart: on-failure:3
    volumes:
      - django_media:/app/media
      - django_static:/app/static

  # Load testing services
  locust-master:
    image: locustio/locust
    container_name: locust-master
    command: -f /mnt/locust/locustfile.py --master
    depends_on:
      django-web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    env_file:
     - .env
    environment:
      - LOCUST_HOST=http://django-web:8000
    ports:
      - "8089:8089"
    profiles:
      - loadtest
      - dev
    volumes:
      - ./locustfiles:/mnt/locust

  locust-worker:
    image: locustio/locust
    volumes:
      - ./locustfiles:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host locust-master
    depends_on:
      locust-master:
        condition: service_started
      django-web:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    profiles:
      - loadtest
      - dev

  # Silk profiling
  silk:
    build: .
    container_name: silk
    command: python manage.py makemigrations && python manage.py migrate
    depends_on:
      django-web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
     - .env
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DJANGO_SETTINGS_MODULE: storefront.settings.dev
    ports:
      - "8002:8000"
    profiles:
      - silk
      - dev
    volumes:
      - .:/app/silk_data/

  # Mail testing
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: smtp4dev
    depends_on:
      - django-web
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - DEBUG=true
    ports:
      - "5000:80"
      - "25:25"
    profiles:
      - mail
      - dev
    restart: on-failure

  # PyTest
  tests:
    build: .
    container_name: tests
    depends_on:
      postgres-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    env_file:
     - .env
    environment:
      DEBUG: ${DEBUG}
      DJANGO_SETTINGS_MODULE: storefront.settings.test
      DATABASE_NAME: ${TEST_DATABASE_NAME}
      DATABASE_USERNAME: ${TEST_DATABASE_USERNAME}
      DATABASE_PASSWORD: ${TEST_DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      POPULATE_DB: ${POPULATE_DB}
    entrypoint: ["/bin/bash", "/app/wait-for-it.sh", "postgres-db:5432", "--", "${TEST_METHOD}"]
    profiles:
      - test
      - dev

# Production service
  django-waitress:
    build: .
    container_name: django-waitress
    command: python /app/server.py
    depends_on:
      postgres-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    env_file:
     - .env
    environment:
      DEBUG: ${DEBUG}
      SILK_PROFILING: ${SILK_PROFILING}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_LOGLEVEL: ${DJANGO_LOGLEVEL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_ENGINE: ${DATABASE_ENGINE}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      POPULATE_DB: ${POPULATE_DB}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: 5432
      DJANGO_SETTINGS_MODULE: storefront.settings.prod
      PYTHONUNBUFFERED: 1
    entrypoint: ["/bin/bash", "/app/wait-for-it.sh", "postgres-db:5432", "--"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/store/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8001:8000"
    profiles:
      - production
    restart: on-failure:3
    volumes:
      - django_media:/app/media
      - django_static:/app/static

volumes:
  postgres-db-data:
  django_media:
  django_static: